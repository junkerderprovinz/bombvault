# Static values for BombVault — not exposed to the user, always applied.
# Prefer ghcr over docker.io per CONTRIBUTIONS.md; ghcr.io/junkerderprovinz/bombvault
# mirrors docker.io/junkerderprovinz/bombvault 1:1 (see the source repo's Dockerfile
# header and README badges).
#
# NOTE (maintenance): `tag` here must track the container image tag actually
# published to the registry, NOT the git release tag. This repo's git/GitHub
# release tags carry a "v" prefix (e.g. v8.0.0), but .github/workflows/build.yml's
# docker/metadata-action `type=semver,pattern={{version}}` rule strips it, so the
# published image tag is the bare "8.0.0". Bump this file's `tag` together with
# app.yaml's `app_version` on every BombVault release meant to reach this catalog
# listing. This is an ongoing commitment, not a one-time value, and the two drift
# apart in silence: nothing here fails when only one of them is bumped, which is
# exactly what happened between 7.11.1 and 8.0.0.
images:
  image:
    repository: ghcr.io/junkerderprovinz/bombvault
    tag: 8.1.0

consts:
  bombvault_container_name: bombvault
  config_path: /config
  host_data_path: /host/user
  # Fixed container-internal ports (match the Dockerfile's ENV PORT/HTTPS_PORT
  # defaults, which this template never overrides) — only the HOST-side
  # published port is user-configurable, via templates/docker-compose.yaml's
  # container_port overrides.
  internal_https_port: 3443
  internal_http_port: 3000
