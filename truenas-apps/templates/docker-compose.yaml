{% set tpl = ix_lib.base.render.Render(values) %}

{# BombVault's image ships no USER directive (see the source repo's
   Dockerfile) and always runs as root: it needs unrestricted read/write
   access to arbitrary host paths (other containers' appdata, owned by many
   different users/groups) and root-equivalent control of the Docker socket.
   Deliberately NOT calling set_user() here — the container runs as whatever
   the image itself defaults to (root), matching app.yaml's run_as_context.
   No permissions/perms container either: root needs none of the chown-style
   fixups that container needs to perform. #}
{% set c1 = tpl.add_container(values.consts.bombvault_container_name, "image") %}

{# Fixed, predictable hostname — same reasoning as this app's generic-Docker-
   host compose file (deploy/docker-compose.generic.yml in the source repo):
   restic's own stale-lock detection can only safely recognize a lock left by
   BombVault's OWN prior incarnation as dead when that prior incarnation
   reported the SAME hostname, and Docker gives every recreated container
   (e.g. on an image update) a new random hostname by default. #}
{% do c1.set_hostname(values.consts.bombvault_container_name) %}

{# The image's own Dockerfile HEALTHCHECK already runs this exact command
   (`bombvault healthcheck`, which reads /api/health internally over
   whichever scheme/port this same process is actually serving) — the
   runtime image carries neither curl nor wget (both are installed only to
   fetch build artifacts and purged again in the same Dockerfile layer), so
   a curl/wget-based test() variant would fail. Reusing the app's own binary
   instead needs no extra tool, exactly like the netbird/tailscale community
   apps use their own CLI as the health probe. #}
{% do c1.healthcheck.set_custom_test(["CMD", "/usr/local/bin/bombvault", "healthcheck"]) %}

{% do c1.environment.add_env("APP_KEY", values.bombvault.app_key) %}
{# Declares the platform explicitly instead of relying on auto-detection —
   internal/platform/detect.go's auto-detect only recognizes Unraid (by
   probing for an Unraid-only marker file) and otherwise falls back to
   generic. A TrueNAS Apps deployment should be unambiguous about which
   platform it's declaring itself as, exactly like this app's generic-
   Docker-host compose file explicitly sets PLATFORM: generic rather than
   relying on auto-detect. Not exposed as a question: it must always be
   "truenas" for this catalog entry. #}
{% do c1.environment.add_env("PLATFORM", "truenas") %}
{% do c1.environment.add_env("HOST_SOURCE_ROOT", values.storage.host_data) %}
{% do c1.environment.add_env("HTTP_ONLY", values.bombvault.http_only) %}
{% if values.bombvault.backup_max_hours is not none %}
  {% do c1.environment.add_env("BACKUP_MAX_HOURS", values.bombvault.backup_max_hours) %}
{% endif %}
{% if values.bombvault.self_container_name %}
  {% do c1.environment.add_env("BOMBVAULT_SELF_CONTAINER", values.bombvault.self_container_name) %}
{% endif %}

{# VM backup (optional, opt-in). LIBVIRT_HOST/SSH_USER/SSH_PORT match
   internal/config/config.go's own defaults, so always setting them here is
   harmless even when VM backup is unused. LIBVIRT_URI, when set, is used
   verbatim by BombVault and these three are then ignored for the connection
   string itself — see internal/config/config.go's doc comment on LibvirtURI
   and docs/vm-backup-ssh-setup.md's "TrueNAS Scale" section in the source
   repo. #}
{% if values.vm_backup.libvirt_uri %}
  {% do c1.environment.add_env("LIBVIRT_URI", values.vm_backup.libvirt_uri) %}
{% endif %}
{% do c1.environment.add_env("LIBVIRT_HOST", values.vm_backup.libvirt_host) %}
{% do c1.environment.add_env("LIBVIRT_SSH_USER", values.vm_backup.libvirt_ssh_user) %}
{% do c1.environment.add_env("LIBVIRT_SSH_PORT", values.vm_backup.libvirt_ssh_port) %}

{% do c1.environment.add_user_envs(values.bombvault.additional_envs) %}

{# Only needed when VM Backup Host is left at its host.docker.internal
   default (i.e. libvirtd runs on this same Docker host) — resolves that
   name to the host's gateway IP. Harmless to always add. #}
{% do c1.add_extra_host("host.docker.internal", "host-gateway") %}

{% do c1.add_docker_socket(read_only=False) %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}

{# Host Data is modeled as a plain required host path (see questions.yaml's
   comment on why it is NOT offered as an ixVolume) — build the same
   IxStorage shape add_storage() expects by hand, the same pattern the
   rsyncd community app uses for its own per-module real-host-path mounts. #}
{% set host_data_cfg = {
  "type": "host_path",
  "host_path_config": {"path": values.storage.host_data, "create_host_path": false},
} %}
{% do c1.add_storage(values.consts.host_data_path, host_data_cfg) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_https_port}) %}
  {% do c1.add_port(values.network.http_port, {"container_port": values.consts.internal_http_port}) %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"name": "WebUI (HTTPS)", "scheme": "https", "port": values.consts.internal_https_port if values.network.host_network else None}) %}
{% do tpl.portals.add(values.network.http_port, {"name": "WebUI (HTTP, only if HTTP Only is on)", "scheme": "http", "port": values.consts.internal_http_port if values.network.host_network else None}) %}

{{ tpl.render() | tojson }}
