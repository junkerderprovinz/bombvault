# TrueNAS Apps catalog metadata for BombVault (community train).
#
# NOT submitted to github.com/truenas/apps yet. This whole truenas-apps/
# directory is Phase B prep work only: forking truenas/apps and opening the
# actual PR is a separate, later, human-gated step. See truenas-apps/README.md
# for what's still outstanding before that can happen.
#
# Fields below are grounded in the real truenas/apps repo as of 2026-08-17:
# CONTRIBUTIONS.md (github.com/truenas/apps/blob/master/CONTRIBUTIONS.md),
# library/hashes.yaml (for lib_version), and several real community apps used
# as structural references — dockhand and duplicati (dict-based storage +
# docker-socket / backup-tool patterns), portainer (add_docker_socket +
# non-root run_as pattern), and nginx-proxy-manager + urbackup (the
# root-only-container pattern this app actually needs, since BombVault's
# image has no USER directive). See the commit message for exact URLs.

app_version: 7.11.1
capabilities: []
categories:
  - backup
changelog_url: https://github.com/junkerderprovinz/bombvault/releases
date_added: '2026-08-17'
description: One-click backup and full disaster recovery for Docker containers and KVM/libvirt VMs, powered by restic.
home: https://github.com/junkerderprovinz/bombvault
host_mounts:
  - description: >-
      Docker socket. Root-equivalent host control: BombVault stops, starts
      and recreates containers around backup and restore.
    host_path: /var/run/docker.sock
icon: https://raw.githubusercontent.com/junkerderprovinz/bombvault/main/.github/assets/icon.png?v=4
keywords:
  - backup
  - restic
  - docker
  - kvm
  - disaster-recovery
lib_version: 2.3.11
lib_version_hash: ""
maintainers:
  - email: junkerderprovinz@users.noreply.github.com
    name: junkerderprovinz
    url: https://github.com/junkerderprovinz
name: bombvault
run_as_context:
  - description: >-
      BombVault's image has no USER directive and always runs as root
      (uid 0): it needs unrestricted read/write access to arbitrary host
      paths owned by many different users/groups (other containers'
      appdata) and root-equivalent control of the Docker socket; VM backup
      additionally SSHes into the hypervisor as root by default. It cannot
      run as an arbitrary non-root uid/gid.
    gid: 0
    group_name: root
    uid: 0
    user_name: root
screenshots: []
sources:
  - https://github.com/junkerderprovinz/bombvault
  - https://hub.docker.com/r/junkerderprovinz/bombvault
  - https://github.com/junkerderprovinz/bombvault/pkgs/container/bombvault
title: BombVault
train: community
version: 1.0.0
