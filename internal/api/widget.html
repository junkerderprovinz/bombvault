<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>BombVault &middot; Activity</title>
<style>
  /* Dark-only by design: the widget always renders the app's IBM Carbon dark
     palette, regardless of the embedding dashboard's theme. */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #212121;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #e0e0e0;
  }
  .tile {
    display: flex; flex-direction: column;
    height: 100%;
    background: #212121;
    overflow: hidden;
  }
  .tile-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: #262626;
    border-bottom: 1px solid #333;
    flex: 0 0 auto;
  }
  .tile-header .title {
    font-size: 13px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: #f4f4f4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile-header .spacer { flex: 1; }
  .tile-header .open-link {
    font-size: 11.5px; color: #f4c63d; text-decoration: none; white-space: nowrap;
  }
  .tile-header .open-link:hover { text-decoration: underline; }

  /* The mini log — BombVault's flat docker-logs style. Scrollable: fixed tile
     height, newest line at the bottom, auto-follow unless scrolled up. */
  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    background: #161616;
    font-family: Consolas, 'Cascadia Mono', Menlo, monospace;
    font-size: 12px; line-height: 1.75;
    padding: 10px 14px 12px;
    scrollbar-width: thin;
    scrollbar-color: #393939 #161616;
  }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: #393939; border-radius: 4px; }
  .log::-webkit-scrollbar-track { background: #161616; }
  .row { display: flex; gap: 9px; white-space: nowrap; overflow: hidden; }
  .ts { color: #8d8d8d; flex: 0 0 auto; }
  .g  { width: 12px; text-align: center; flex: 0 0 auto; }
  .msg { overflow: hidden; text-overflow: ellipsis; }
  /* Line colours — these MIRROR the SPA's ActivityLog.tsx colorFor(), one
     class per LogStatus bucket. This file cannot read web/src/index.css's
     custom properties (it is a standalone, dark-only document served straight
     from the Go binary), so each hex below is a hard-copy of that file's dark
     token. That silent pairing is how issue #164 happened: the dashboard's
     off-site colour moved and this file, frozen at the old value, was never
     swept. Do not change one side alone —
     internal/api/widget_internal_test.go's TestWidgetOffsiteColourMatchesToken
     fails if `.offsite` here and --status-offsite-text there ever drift.
       .ok      = --status-ok-text
       .fail    = --status-fail-text
       .offsite = --status-offsite-text  (off-site replication, its own
                  identity colour — NOT the accent; see index.css)
       .info    = --status-warn-text     (skipped / unexpected)
       .idle    = --status-warn-text     (the trailing "next: …" line, which
                  the SPA also renders as a status-"info" line) */
  .ok      { color: #6fdc8c; }
  .fail    { color: #ff8389; }
  .offsite { color: #78a9ff; }
  .info    { color: #f1c21b; }
  .idle    { color: #f1c21b; }

  .tile-footer {
    flex: 0 0 auto;
    padding: 7px 14px;
    background: #262626; border-top: 1px solid #333;
    font-size: 11px; color: #8d8d8d;
    display: flex; justify-content: space-between; gap: 10px;
    white-space: nowrap;
  }
  .tile-footer span { overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="tile">
    <div class="tile-header">
      <div class="title">BombVault &middot; Activity</div>
      <div class="spacer"></div>
      <a class="open-link" href="/" target="_top">open BombVault &rarr;</a>
    </div>
    <div class="log" id="log"></div>
    <div class="tile-footer">
      <span id="refresh">loading&hellip;</span>
      <span id="version"></span>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var POLL_MS = 10000;
  // Auto-follow slack: mirrors the SPA activity log's BOTTOM_THRESHOLD_PX —
  // within this many px of the bottom counts as "following".
  var FOLLOW_SLACK = 24;

  var token = new URLSearchParams(location.search).get("token") || "";
  var logEl = document.getElementById("log");
  var refreshEl = document.getElementById("refresh");
  var versionEl = document.getElementById("version");
  var lastRefresh = null;
  var offline = false;
  var firstRender = true;

  // ---- English label tables (the widget is English-only by design; phrasing
  // mirrors the SPA's activityLog.ts finished-line templates) ----------------
  var DOMAIN_LABELS = {
    containers: "Containers", vms: "VMs", flash: "Flash",
    config: "Self-Backup", files: "Folders"
  };
  var JOB_LABELS = {
    backup: "backup", offsite: "off-site replication",
    drill: "restore-verification drill", tamper: "tamper test",
    digest: "weekly digest"
  };

  function domainLabel(d) { return DOMAIN_LABELS[d] || d; }

  // ---- tiny formatters -----------------------------------------------------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTs(sec) {
    var d = new Date(sec * 1000);
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " +
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  function fmtClock(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtDur(s) {
    s = Math.max(0, Math.round(s));
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60), sec = s % 60;
    if (m < 60) return sec ? m + "m " + sec + "s" : m + "m";
    var h = Math.floor(m / 60), mm = m % 60;
    return mm ? h + "h " + mm + "m" : h + "h";
  }
  function fmtBytes(n) {
    if (!n || n <= 0) return "0 B";
    var units = ["B", "KB", "MB", "GB", "TB"];
    var v = n, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v : v.toFixed(1)) + " " + units[i];
  }

  // ---- line composition (mirrors activityLog.ts finishedLineText) ----------
  function bucket(r) {
    if (r.status === "success") return r.kind === "offsite" ? "offsite" : "ok";
    if (r.status === "failed") return "fail";
    return "info"; // skipped + anything unexpected
  }
  function glyph(b) {
    return b === "ok" ? "✓" : b === "fail" ? "✗" :
      b === "offsite" ? "↗" : "ⓘ"; // ✓ ✗ ↗ ⓘ
  }
  // One class per bucket — deliberately NOT collapsing "offsite" into "info"
  // (issue #164): before this fix the offsite bucket fell through to `.info`,
  // so the two shared a colour here and a later edit to `.info` alone could
  // silently re-break the SPA pairing. See the .offsite rule's comment above.
  function cls(b) {
    return b === "ok" ? "ok" : b === "fail" ? "fail" : b === "offsite" ? "offsite" : "info";
  }
  function other(name, r) { return name + " " + r.kind + " — " + r.status; }
  function lineText(r) {
    var dur = fmtDur(((r.finishedAt != null ? r.finishedAt : r.startedAt) - r.startedAt));
    var dom = domainLabel(r.domain);
    var name = r.target || dom;
    var ok = r.status === "success", failed = r.status === "failed";
    switch (r.kind) {
      case "prune":
        return ok ? "Retention prune done — " + dom :
          failed ? "Prune failed — " + dom + ": " + r.error : other(dom, r);
      case "verify":
        return ok ? "Verify passed — " + dom :
          failed ? "Verify failed — " + dom + ": " + r.error : other(dom, r);
      case "offsite":
        return ok ? "Off-site replication done — " + dom + " (" + dur + ")" :
          failed ? "Off-site replication failed — " + dom + ": " + r.error : other(dom, r);
      case "drill":
        return ok ? "Restore check passed — " + dom :
          failed ? "Restore check failed — " + dom + ": " + r.error : other(dom, r);
      case "drdrill":
        return ok ? "Off-site DR restore verified — " + dom :
          failed ? "Off-site DR restore FAILED — " + dom + ": " + r.error : other(dom, r);
      case "tamper":
        return ok ? "Tamper test passed — " + dom + " (delete refused)" :
          failed ? "Tamper test FAILED — " + dom + " is not append-only: " + r.error :
          r.status === "skipped" ? "Tamper test skipped — " + dom + ": " + r.error : other(dom, r);
      case "export":
        return ok ? "Flash ZIP export done — " + fmtBytes(r.bytes) + " (" + dur + ")" :
          failed ? "Flash ZIP export failed — " + r.error : other(dom, r);
      case "restore":
        return ok ? name + " restored — " + dur :
          failed ? name + " restore failed — " + r.error : other(name, r);
      case "update":
        return ok ? name + " updated — " + dur :
          failed ? name + " update failed — " + r.error : other(name, r);
      default: // backup (and any future kind falls back to the same shape)
        if (ok) return name + " backed up — " + fmtBytes(r.bytes) + " in " + dur;
        if (failed) return name + " backup failed — " + r.error;
        if (r.status === "skipped") return name + " backup skipped — " + r.error;
        return other(name, r);
    }
  }

  // ---- rendering -----------------------------------------------------------
  function row(ts, g, c, text, extra) {
    var div = document.createElement("div");
    div.className = "row" + (extra ? " " + extra : "");
    var t = document.createElement("span"); t.className = "ts"; t.textContent = ts;
    var gl = document.createElement("span"); gl.className = "g " + c; gl.textContent = g;
    var m = document.createElement("span"); m.className = "msg " + c; m.textContent = text;
    m.title = text; // full text on hover — lines are single-row ellipsized
    div.appendChild(t); div.appendChild(gl); div.appendChild(m);
    return div;
  }

  function isAtBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight <= FOLLOW_SLACK;
  }

  function render(data) {
    var follow = firstRender || isAtBottom();

    // Finished runs only, oldest first — newest ends up at the BOTTOM.
    var runs = (data.runs || []).filter(function (r) { return r.finishedAt != null; });
    runs.sort(function (a, b) {
      return (a.finishedAt - b.finishedAt) || (a.startedAt - b.startedAt);
    });

    var frag = document.createDocumentFragment();
    for (var i = 0; i < runs.length; i++) {
      var r = runs[i], b = bucket(r);
      frag.appendChild(row(fmtTs(r.finishedAt), glyph(b), cls(b), lineText(r)));
    }

    // Trailing idle line: the soonest scheduled fire ("next: …"), or "nothing
    // yet" when there is neither history nor a schedule.
    var next = (data.next || [])[0];
    if (next) {
      var at = new Date(next.next).getTime();
      var text = "next: " + (JOB_LABELS[next.job] || next.job) +
        (next.domain ? " (" + domainLabel(next.domain) + ")" : "") +
        " at " + fmtClock(at) + " (in " + fmtDur((at - Date.now()) / 1000) + ")";
      frag.appendChild(row(fmtTs(Date.now() / 1000), "▶", "idle", text));
    } else if (runs.length === 0) {
      frag.appendChild(row(fmtTs(Date.now() / 1000), "▶", "idle", "nothing yet"));
    }

    logEl.textContent = "";
    logEl.appendChild(frag);
    if (follow) logEl.scrollTop = logEl.scrollHeight;
    firstRender = false;

    versionEl.textContent = data.version ? "BombVault " + data.version : "BombVault";
  }

  // ---- footer ticker + polling --------------------------------------------
  function tickFooter() {
    if (offline) { refreshEl.textContent = "connection lost — retrying…"; return; }
    if (lastRefresh == null) { refreshEl.textContent = "loading…"; return; }
    var s = Math.max(0, Math.round((Date.now() - lastRefresh) / 1000));
    refreshEl.textContent = "last refresh: " + s + "s ago · polls every 10s";
  }
  setInterval(tickFooter, 1000);

  function poll() {
    fetch("/api/widget/data?token=" + encodeURIComponent(token), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data.ok) throw new Error(data.error || "feed error");
        offline = false;
        lastRefresh = Date.now();
        render(data);
        tickFooter();
      })
      .catch(function () {
        offline = true;
        tickFooter();
      });
  }
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
