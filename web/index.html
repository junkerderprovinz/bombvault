<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Lets Chrome and Edge install BombVault as an app. There is no service
         worker: one would cache the interface, and after an update people would
         keep seeing the old one. -->
    <link rel="manifest" href="/manifest.json" />
    <!-- viewport-fit=cover extends the layout viewport into the device's own
         unsafe edges (notch, rounded corners, home indicator). Without it the
         system chrome insets the viewport and every env(safe-area-inset-*)
         expression, surfaced as the --safe-area-* custom properties in
         src/index.css, silently resolves to 0px, so the two declarations are
         one contract and must change together. interactive-widget=resizes-
         content makes the Android keyboard resize the layout viewport instead
         of overlaying it, which is the behavior the Layout-level keyboard
         mechanism builds on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Browser-chrome color (mobile address bar, task switcher). The static
         content is the dark ground, which a browser without JavaScript shows.
         The script below writes the resolved theme's ground here before the
         first paint, which is why the tag stands above it, and
         src/lib/theme.ts's paint() takes over afterwards. The static value,
         the script's map and theme.ts's THEME_COLOR change together. -->
    <meta name="theme-color" content="#161616" />
    <!-- Stamps data-theme, and data-oled where this screen wants true black,
         before any CSS paints, so the wrong theme never flashes while
         lib/theme.ts, a deferred module script, is still loading. It only sets
         attributes and never hides content. It repeats lib/theme.ts's storage
         keys and resolution, since it cannot import that module, so keep the
         two in sync. Inside the Android app the phone's OLED choice comes as
         window.bombvaultDevice. -->
    <script>
      (function () {
        try {
          var device = window.bombvaultApp && window.bombvaultDevice;
          var oled = device ? device.oled === true : localStorage.getItem("bv-oled") === "1";
          var THEME_COLOR = { dark: oled ? "#000000" : "#161616", light: "#f4f4f4" };
          var stored = localStorage.getItem("bv-theme");
          var resolved =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
          if (oled) document.documentElement.setAttribute("data-oled", "");
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", THEME_COLOR[resolved]);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>BombVault</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
