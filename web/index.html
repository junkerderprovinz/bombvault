<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FOUC prevention (GlimStone form-engine #1): data-theme is no longer
         hard-coded above, so the theme now genuinely defaults to the OS via
         prefers-color-scheme (design-language.md's "Default is system, not
         a hard-coded light or dark"). This script stamps the resolved
         data-theme attribute synchronously — before any CSS paints — so
         there's no flash of the wrong theme while lib/theme.ts's module
         script (deferred by `type="module"`) is still loading. It ONLY sets
         an attribute, it never hides content, matching this project's
         established FOUC-killer convention (additive gating, never a blank
         page). Duplicates lib/theme.ts's storage key/resolution logic since
         it can't import that module here — keep the two in sync. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bv-theme");
          var resolved =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- viewport-fit=cover extends the layout viewport into the device's own
         unsafe edges (notch, rounded corners, home indicator). Without it the
         system chrome insets the viewport and every env(safe-area-inset-*)
         expression — surfaced as the --safe-area-* custom properties in
         src/index.css — silently resolves to 0px, so the two declarations are
         one contract and must change together. interactive-widget=resizes-
         content makes the Android keyboard resize the layout viewport instead
         of overlaying it, which is the behavior the Layout-level keyboard
         mechanism builds on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Static first-paint theme-color fallback (#161616 = dark --carbon-bg).
         src/lib/theme.ts's paint() mirrors the live theme into this tag on
         EVERY theme application (#f4f4f4 light) — this static value is only
         what shows before JS runs, so the two sets of values must change
         together. -->
    <meta name="theme-color" content="#161616" />
    <title>BombVault</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
