name: Instant Repo-Watch Ping

# The same file sits in every repository of this account; repo-watch's README lists
# them and explains how to add a new one. It hands new issues, pull requests,
# comments and reviews from other people to junkerderprovinz/repo-watch as a
# repository_dispatch event, and repo-watch posts to Matrix with its own credentials,
# so no Matrix secret ever reaches this repository.
#
# Repositories the account does not own cannot run this, because GitHub only fires
# these triggers for a repository's own workflows. Replies there are picked up by
# repo-watch's five-minute poll.

on:
  issues:
    types: [opened]
  # pull_request_target, because a pull request from a fork gets no secrets under
  # pull_request, so gh would fail without REPOWATCH_PAT exactly when a stranger
  # opens one. It is safe here: the job checks out no code, and every event field
  # reaches the script through an environment variable.
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  dispatch:
    # The account's own actions and bots need no ping.
    if: github.event.sender.login != 'junkerderprovinz' && !endsWith(github.event.sender.login, '[bot]')
    runs-on: ubuntu-latest
    # A hung API call would otherwise run into GitHub's six-hour limit, in dozens of
    # repositories.
    timeout-minutes: 5
    steps:
      - name: Dispatch to repo-watch
        env:
          GH_TOKEN: ${{ secrets.REPOWATCH_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.event.sender.login }}
        # Titles are attacker-controlled on a public repository. Read from the
        # environment they stay plain strings; interpolated with ${{ }} they would be
        # parsed as shell.
        run: |
          kind="issue"
          number="$ISSUE_NUMBER"
          title="$ISSUE_TITLE"
          url="$ISSUE_URL"
          case "$EVENT_NAME" in
            # github.event_name carries pull_request_target for the trigger above.
            pull_request|pull_request_target)
              kind="pr"; number="$PR_NUMBER"; title="$PR_TITLE"; url="$PR_URL" ;;
            issue_comment)
              kind="comment"; number="$ISSUE_NUMBER"; title="$ISSUE_TITLE"; url="$COMMENT_URL" ;;
            pull_request_review)
              kind="review"; number="$PR_NUMBER"; title="$PR_TITLE"; url="$REVIEW_URL" ;;
          esac
          gh api "repos/junkerderprovinz/repo-watch/dispatches" \
            -f event_type=repo-activity \
            -f "client_payload[repo]=$REPO_NAME" \
            -f "client_payload[kind]=$kind" \
            -f "client_payload[number]=$number" \
            -f "client_payload[title]=$title" \
            -f "client_payload[url]=$url" \
            -f "client_payload[actor]=$ACTOR"
