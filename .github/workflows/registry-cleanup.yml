name: Registry Cleanup

# Deletes a single image tag from GHCR and Docker Hub, run by hand. GHCR
# deletes whole versions, so a version that still carries another tag besides
# its sha tag is refused; point that tag elsewhere first with "move".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to delete (e.g. 1.0.1)"
        required: true
      move:
        description: "Tags to point at another image first, as tag=source pairs separated by spaces (e.g. 1.0=1.0.0)"
        required: false
        default: ""

env:
  IMAGE_NAME: bombvault

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        if: ${{ inputs.move != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ inputs.move != '' && vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move tags
        if: ${{ inputs.move != '' }}
        env:
          MOVE: ${{ inputs.move }}
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
          DH_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          for pair in $MOVE; do
            tag="${pair%%=*}"
            src="${pair#*=}"
            if [ -z "$tag" ] || [ "$src" = "$pair" ] || [ -z "$src" ]; then
              echo "::error::'$pair' is not a tag=source pair"
              exit 1
            fi
            docker buildx imagetools create -t "${GHCR_REGISTRY}/${IMAGE_NAME}:${tag}" "${GHCR_REGISTRY}/${IMAGE_NAME}:${src}"
            echo "GHCR: ${tag} -> ${src}"
            if [ -n "$DH_USER" ]; then
              docker buildx imagetools create -t "docker.io/${DH_USER}/${IMAGE_NAME}:${tag}" "docker.io/${DH_USER}/${IMAGE_NAME}:${src}"
              echo "Docker Hub: ${tag} -> ${src}"
            fi
          done

      - name: Delete tag from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          api="/users/${{ github.repository_owner }}/packages/container/${IMAGE_NAME}"
          if ! versions=$(gh api --paginate "${api}/versions"); then
            echo "::warning::GHCR: listing versions failed (token scope?), skipping GHCR"
            exit 0
          fi
          id=$(echo "$versions" | jq -r --arg t "$TAG" \
            '.[] | select(.metadata.container.tags | index($t)) | .id' | head -1)
          if [ -z "$id" ]; then
            echo "GHCR: no version tagged '$TAG', nothing to do"
            exit 0
          fi
          tags=$(echo "$versions" | jq -r --arg t "$TAG" \
            '.[] | select(.metadata.container.tags | index($t)) | .metadata.container.tags | join(", ")')
          echo "GHCR: version $id carries tags: $tags"
          others=$(echo "$versions" | jq -r --arg t "$TAG" \
            '.[] | select(.metadata.container.tags | index($t)) | .metadata.container.tags
              | map(select(. != $t and (startswith("sha-") | not))) | join(", ")')
          if [ -n "$others" ]; then
            echo "::error::Refusing to delete: this version also carries $others. Move them first."
            exit 1
          fi
          gh api -X DELETE "${api}/versions/${id}"
          echo "GHCR: deleted version $id (tag $TAG)"

      - name: Delete tag from Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        env:
          DH_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$DH_PASS" ]; then
            echo "::warning::DOCKERHUB_TOKEN not set, skipping Docker Hub"
            exit 0
          fi
          jwt=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\":\"$DH_USER\",\"password\":\"$DH_PASS\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "::error::Docker Hub login failed"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: JWT $jwt" \
            "https://hub.docker.com/v2/repositories/${DH_USER}/${IMAGE_NAME}/tags/${TAG}/")
          echo "Docker Hub: DELETE tags/${TAG} -> HTTP $code"
          case "$code" in
            2*) echo "Docker Hub: deleted" ;;
            404) echo "Docker Hub: tag already gone" ;;
            *) echo "::error::Docker Hub: unexpected status $code"; exit 1 ;;
          esac
