# .github/workflows/lint.yml
#
# The web job is where the settled UI conventions are enforced: `npm run lint`
# runs web/lint-rules/ (an icon badge without a tooltip, a square icon badge at
# the wrong size, a page off the shared shell, a destructive control painting
# itself red, a control hardcoding a radius or an accent), and `npm test` runs
# those rules' own tests plus the routed-page coverage guard. Both were already
# steps here, so the conventions need no job of their own.
#
# `experiment/**` is in the push triggers on purpose. Every UI round of this
# project happens on an experiment branch and merges from there, so a gate that
# only ran on main would not be seen until after the work it was meant to catch
# — which is the same "it lived somewhere nobody ran it" failure the lint rules
# themselves exist to fix. Public repo, so the extra runs cost nothing.
#
# `integration/**` is here for the same reason, learned the expensive way. A
# long-lived integration branch carried 227 commits and nine rounds of review
# without CI ever seeing one of them, because it was neither main nor an
# experiment branch and had no pull request. What finally caught it was a
# migration number that main had taken meanwhile — a collision any run of this
# workflow on the branch would have surfaced the day it appeared, instead of two
# days later as a blocker for the whole feature. Only lint.yml gets the branch:
# build.yml publishes images, and a branch has no business doing that.
on:
  push: { branches: [main, feat/v4, "experiment/**", "integration/**"] }
  pull_request: { branches: [main] }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: '1.27' }
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version: latest }
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '24' }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: '1.27' }
      - name: install restic >= 0.17 (apt's restic is too old for --insecure-no-password)
        run: |
          RESTIC_VERSION=0.17.3
          # SHA256 for restic_0.17.3_linux_amd64.bz2 from the upstream SHA256SUMS
          # (https://github.com/restic/restic/releases/download/v0.17.3/SHA256SUMS);
          # keep in sync with RESTIC_SHA256_AMD64 in the Dockerfile.
          RESTIC_SHA256=5097faeda6aa13167aae6e36efdba636637f8741fed89bbf015678334632d4d3
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          restic version
      - run: go test ./...
  playwright:
    # The responsive-regression gate: the specs under web/e2e/ boot the real
    # binary over a wiped fresh DB (see web/playwright.config.ts) and hold the
    # mobile-shell, Dashboard, desktop-invariance and narrow-viewport
    # contracts across Chromium + WebKit, phone and desktop projects. The
    # binary is built AFTER the web build because it embeds web/dist.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: '1.27' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run build
      - name: build the server under test at the repo root (the webServer command's binary)
        working-directory: ${{ github.workspace }}
        run: go build -o bombvault ./cmd/bombvault
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
