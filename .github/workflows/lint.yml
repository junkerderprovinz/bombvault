# npm run lint includes the UI convention rules in web/lint-rules/, and npm test
# runs their tests along with the routed-page coverage guard.
#
# experiment/** and integration/** branches often go without a pull request, so
# they are checked on push; a check that only runs on main finds the problem
# after the merge.
on:
  push: { branches: [main, feat/v4, "experiment/**", "integration/**"] }
  pull_request: { branches: [main] }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: '1.27' }
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version: latest }
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '24' }
      - run: npm ci
      # typecheck covers the app program and the Playwright harness program (see
      # tsconfig.harness.json for why they are two).
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: '1.27' }
      - name: install restic >= 0.17 (apt's restic is too old for --insecure-no-password)
        run: |
          RESTIC_VERSION=0.17.3
          # From https://github.com/restic/restic/releases/download/v0.17.3/SHA256SUMS;
          # keep in sync with RESTIC_SHA256_AMD64 in the Dockerfile.
          RESTIC_SHA256=5097faeda6aa13167aae6e36efdba636637f8741fed89bbf015678334632d4d3
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          restic version
      - run: go test ./...
  playwright:
    # The responsive-regression gate: the specs under web/e2e/ boot the real
    # binary over a wiped fresh DB (see web/playwright.config.ts) and hold the
    # mobile-shell, Dashboard, desktop-invariance and narrow-viewport
    # contracts across Chromium + WebKit, phone and desktop projects. The
    # binary is built after the web build, because it embeds web/dist.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: '1.27' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run build
      - name: build the server under test at the repo root (the webServer command's binary)
        working-directory: ${{ github.workspace }}
        run: go build -o bombvault ./cmd/bombvault
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      # A red gate must leave its evidence behind: the headless runner is gone
      # by the time anyone reads the log, and the HTML report + per-test
      # failure artifacts are the only way to see what broke (a screenshot, a
      # trace, which project). Uses-steps ignore the job's run
      # working-directory, so the paths are workspace-relative.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
