name: Build Docker Image

# Build the multi-arch image and push it to GHCR so it can be pulled on the Unraid
# box. Pull requests build only (no push).
#
# EVERY branch builds and pushes, not just main. A feature branch used to produce
# no image at all, which sounds harmless and is not: the only way to try a change
# on the real server was to put it on main first, so feature work and hotfixes kept
# landing in the same place and had to be untangled afterwards. A branch push now
# lands at ghcr.io/junkerderprovinz/bombvault:<branch> (slashes become hyphens), so
# a branch can be tested on bottich for as long as it needs before it is merged.
#
# What a branch build deliberately does NOT touch: `latest`, `edge`, the semver
# tags, the Docker Hub mirror and the Docker Hub description. Those belong to main
# and to release tags — see the metadata step below.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write # Trivy uploads its CVE report (SARIF) to the Security tab

# One build per ref. A branch under active development gets pushed to repeatedly,
# and without this every push queues another full multi-arch build behind the last.
# Superseded branch builds are cancelled; main and tags are never cancelled, because
# a release build that dies halfway leaves the registry half-written.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != github.event.repository.default_branch }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Boot smoke test: a green build is not a booting container. Build the amd64
  # image, run it, and confirm it serves /api/health before we push :latest /
  # the release tag. The push job depends on this, so a non-booting image can
  # never reach the registry.
  smoke:
    name: Boot smoke test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build amd64 image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bombvault:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container + health check
        run: |
          docker run -d --name bv-smoke \
            -e APP_KEY="$(openssl rand -hex 32)" \
            -e HTTP_ONLY=true \
            -p 3000:3000 bombvault:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "✓ container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "✗ container did not become healthy in time"
          docker logs bv-smoke || true
          exit 1
      - name: Verify tini is PID 1 (zombie reaper, #35)
        run: |
          # BombVault shells out to restic, which forks rclone for off-site repos.
          # A cancelled/killed restic orphans its rclone child onto PID 1; if PID 1
          # is not a reaping init those pile up as [rclone] <defunct> (#35). tini as
          # PID 1 reaps them. /proc/1/comm is the live proof the ENTRYPOINT took.
          pid1=$(docker exec bv-smoke cat /proc/1/comm)
          echo "PID 1 is: $pid1"
          if [ "$pid1" != "tini" ]; then
            echo "✗ PID 1 is '$pid1', not tini — the zombie reaper is missing (#35 would regress)"
            exit 1
          fi
          echo "✓ tini is PID 1 — orphaned rclone/ssh grandchildren get reaped"
      # Non-blocking CVE scan of the just-built image. Reports HIGH/CRITICAL
      # findings to the Security tab (SARIF). Deliberately does NOT fail the
      # build (exit-code 0): most findings live in the upstream base image and
      # can't be fixed here, so this is visibility, not a release gate.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bombvault:smoke
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Cleanup
        if: always()
        run: docker rm -f bv-smoke || true

  build:
    name: Build (amd64 + arm64)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Push only on main / manual runs, never from pull requests.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror — active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Is the tag being built the newest release in this repo?
      #
      # `latest` moves only for a tag build (see the metadata block below), and
      # only for the highest version. Both halves are needed and they guard
      # different accidents: gating on tags stops an unreleased merge from
      # reaching everybody who pulls `latest`, and gating on "newest" stops a
      # re-cut of an older version from dragging `latest` backwards, which is
      # exactly what happened on 2026-09-02 with v8.3.0.
      #
      # checkout gives no tags by default, so they are fetched here rather than
      # assumed. `sort -V` orders versions, not strings, so v8.10.0 beats v8.9.0.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # The Docker Hub mirror carries releases and main, never a feature
          # branch: it is the address people pull by hand from the template, and
          # an unfinished branch has no business appearing in that tag list.
          images: |
            ${{ env.IMAGE }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }},enable=${{ vars.DOCKERHUB_USERNAME != '' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) }}
          # `latest` MEANS "the newest released version", and nothing else.
          #
          # It used to mean "the tip of main", which is not the same thing and
          # was not meant to be: the comment here even argued that main is at or
          # ahead of the newest tag whenever a release is cut, so latest tracks
          # the newest code. That is true and it is the problem. On 2026-09-14 a
          # 23-commit merge to main put an unreleased build in front of everyone
          # pulling `latest` before a release existed, and the first bug report
          # against it arrived before the release notes did.
          #
          # So: a tag build sets `latest`, and only when that tag is the newest
          # release (see the step above). Gating on the tag alone would bring
          # back the older accident in the other direction - on 2026-09-02 a
          # re-cut of v8.3.0, long after v8.4.0 shipped, moved `latest` back onto
          # 8.3.0 - which is why both halves are there.
          #
          # `edge` is where the tip of main goes now. Still pullable, still
          # built, still smoke-tested; just nobody gets it without asking.
          #
          # STILL SHARP, deliberately: {{major}} and {{major}}.{{minor}} below
          # are moved by whichever tag built last, so re-cutting an old version
          # drags `8` back with it. Correct for a normal forward release and
          # wrong only while folding, which is rare enough to handle by hand.
          # After folding, re-run the NEWEST tag's build and check that
          # latest/8/8.<minor> all resolve to the same digest.
          #
          # A branch that is not main gets its own name as the tag and nothing
          # else, so `docker pull ghcr.io/.../bombvault:feat-retention-preview`
          # fetches exactly that branch's tip and no moving tag follows along.
          # The semver lines below only ever match a tag build, so they stay out
          # of a branch build on their own.
          tags: |
            type=sha,format=short
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Stamp a meaningful version into the binary. Tag builds use the tag
      # (e.g. v3.1.0); every other build uses the latest release tag plus the
      # BRANCH and the short SHA (e.g. v3.1.0+main.4c0c987), so the log banner
      # and the WebUI show a real version rather than the literal branch name
      # (issue #22).
      #
      # The branch used to be the hard-coded word "main", which was true while
      # the only non-tag builds came from main. It stopped being true the day a
      # feature branch was built by `workflow_dispatch`, and it misled exactly
      # as you would expect: an image built from `feature/control-engine`
      # reported `v8.3.1+main.56dedc8`, and jdp reasonably read that as "you
      # pushed to main". Nothing had been pushed to main; the string was simply
      # not looking at the branch. It looks now.
      #
      # Slashes become hyphens because SemVer build metadata (everything after
      # the "+") allows only alphanumerics, hyphens and dots — `feature/x` would
      # make the whole version unparseable, and `internal/releasenotes` does
      # parse it.
      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
          else
            tag=$(gh release view -R "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)
            sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
            branch=$(printf '%s' "${{ github.ref_name }}" | tr '/_' '--')
            if [ -n "$tag" ]; then v="${tag}+${branch}.${sha}"; else v="0.0.0+${branch}.${sha}"; fi
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "computed version: $v"
      - name: Build multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations: SLSA build provenance + an SBOM, attached
          # to the image in the registry so consumers can verify how it was built
          # and what it contains.
          provenance: true
          sbom: true

      # Mirror the GitHub README to the Docker Hub repo's Overview.
      #
      # This uses DOCKERHUB_TOKEN, the same access token the push above uses.
      # It used to use a separate DOCKERHUB_PASSWORD, on the belief that a push
      # token cannot edit a description. That was measured wrong on 2026-09-05:
      # an access token with read, write and delete scope edits it fine, while
      # the account password is refused outright with 401, because Docker Hub's
      # legacy login endpoint rejects a password once 2FA is on. One secret,
      # and the one that actually works.
      # Releases and main only, for the same reason the mirror itself is: a README
      # edited on a feature branch would otherwise rewrite the public Docker Hub
      # overview before anyone had agreed to the change.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set — skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          short-description: "Backup and full disaster recovery for Unraid: Docker containers, KVM VMs and the USB flash."
          # The full README exceeds Docker Hub's 25000-byte description limit (it
          # gets truncated mid-page), so Docker Hub gets a condensed edition that
          # links back to GitHub for the full docs.
          readme-filepath: .github/DOCKERHUB.md
          enable-url-completion: true
