name: Build Docker Image

# Builds the multi-arch image and pushes it to GHCR; pull requests only build.
#
# Every branch is pushed as ghcr.io/junkerderprovinz/bombvault:<branch> (slashes
# become hyphens), so it can be tried on a server before it is merged. latest,
# edge, the semver tags and Docker Hub stay with main and release tags. The
# weekly cron and a manual run rebuild the newest release without the layer
# cache, under its version tags and latest.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # The release notes are Markdown but embedded in the binary, so they build.
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!docs/**"
      - "internal/releasenotes/notes/**"
  pull_request:
    branches: [main]
  # Weekly, to rebuild the newest release on fresh base images and packages.
  schedule:
    - cron: '20 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write # Trivy uploads its CVE report (SARIF) to the Security tab

# A newer push cancels a running branch build. Builds of main and of tags are
# left to finish, since a release build cut off halfway leaves the registry
# half-written. A rebuild of the newest release queues apart from main.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'rebuild' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != github.event.repository.default_branch }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Rebuilds refresh the newest release, which is what people run, not the
  # tip of main.
  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.newest.outputs.tag }}
      sha: ${{ steps.newest.outputs.sha }}
    steps:
      - name: Find the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "rebuilding $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" >> "$GITHUB_OUTPUT"

  # The build job waits for this, so an image that does not boot never reaches
  # the registry.
  smoke:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    name: Boot smoke test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build amd64 image (load locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bombvault:smoke
          build-args: |
            VERSION=${{ needs.release.outputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ needs.release.outputs.tag != '' }}
      - name: Run container + health check
        run: |
          docker run -d --name bv-smoke \
            -e APP_KEY="$(openssl rand -hex 32)" \
            -e HTTP_ONLY=true \
            -p 3000:3000 bombvault:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "✓ container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "✗ container did not become healthy in time"
          docker logs bv-smoke || true
          exit 1
      - name: Verify tini is PID 1 (zombie reaper, #35)
        run: |
          # Without tini as PID 1, the rclone children of a killed restic pile up
          # as zombies (see the Dockerfile).
          pid1=$(docker exec bv-smoke cat /proc/1/comm)
          echo "PID 1 is: $pid1"
          if [ "$pid1" != "tini" ]; then
            echo "✗ PID 1 is '$pid1', not tini: the zombie reaper is missing (#35)"
            exit 1
          fi
          echo "✓ tini is PID 1, so orphaned rclone/ssh grandchildren get reaped"
      # Reports to the Security tab without failing the build: most findings are
      # in the base image and cannot be fixed here.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bombvault:smoke
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Cleanup
        if: always()
        run: docker rm -f bv-smoke || true

  build:
    name: Build (amd64 + arm64)
    needs: [ release, smoke ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without the DOCKERHUB_USERNAME variable the image goes to GHCR only.
      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest moves only for the newest tag, so re-cutting an older version
      # cannot drag it backwards. checkout fetches no tags, and sort -V puts
      # v8.10.0 after v8.9.0.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Docker Hub is what the template pulls, so it gets main and releases
          # but no branches.
          images: |
            ${{ env.IMAGE }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }},enable=${{ vars.DOCKERHUB_USERNAME != '' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch || needs.release.outputs.tag != '') }}
          # latest is the newest release, so an unreleased merge never reaches
          # people who pull it, and a rebuild of that release moves it too. The
          # action adds latest to every semver tag unless the flavor turns that
          # off. The tip of main goes to edge, and any other branch gets a tag
          # of its own name and nothing else.
          #
          # {{major}} and {{major}}.{{minor}} follow whichever tag built last,
          # so re-cutting an old version moves them back. After that, re-run
          # the newest tag's build and check that latest, 8 and 8.<minor> share
          # a digest.
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,enable=${{ needs.release.outputs.tag == '' }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && needs.release.outputs.tag == '' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && needs.release.outputs.tag == '' }}
            type=raw,value=latest,enable=${{ (github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true') || needs.release.outputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
          # A rebuild of the newest release carries the release's commit, not main's.
          labels: |
            ${{ needs.release.outputs.tag != '' && format('org.opencontainers.image.revision={0}', needs.release.outputs.sha) || '' }}

      # Tag builds and rebuilds of the newest release use the tag. Other builds
      # use the latest release plus branch and short SHA (v3.1.0+main.4c0c987),
      # so the log banner and the WebUI show where the image came from. SemVer
      # build metadata allows only alphanumerics, hyphens and dots, and
      # internal/releasenotes parses the version, so slashes and underscores
      # become hyphens.
      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.release.outputs.tag }}
        run: |
          if [ -n "$RELEASE" ]; then
            v="$RELEASE"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
          else
            tag=$(gh release view -R "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)
            sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
            branch=$(printf '%s' "${{ github.ref_name }}" | tr '/_' '--')
            if [ -n "$tag" ]; then v="${tag}+${branch}.${sha}"; else v="0.0.0+${branch}.${sha}"; fi
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "computed version: $v"
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ needs.release.outputs.tag != '' }}
          provenance: true
          sbom: true

      # The push token can edit the Docker Hub overview when it has read, write
      # and delete scope; the account password is refused once 2FA is on. Main
      # and releases only, so a branch cannot rewrite the public overview.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping the Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          short-description: "Backup and full disaster recovery for Unraid: Docker containers, KVM VMs and the USB flash."
          # Docker Hub cuts descriptions at 25000 bytes, so it gets a shorter
          # README that links back to GitHub.
          readme-filepath: .github/DOCKERHUB.md
          enable-url-completion: true
