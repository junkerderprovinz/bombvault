name: Android

# The app is the launcher, which the web build produces, around each server's
# own interface. A GitHub runner brings the Android SDK and a JDK.
on:
  pull_request:
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE: ${{ github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Checked before anything slow runs: a release APK signed with anything
      # but the release key can never be updated by the next one.
      - name: The signing key is there
        if: env.RELEASE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release APK needs the release key"
            exit 1
          fi

      # F-Droid builds the tag with the number gradle.properties carries.
      - name: The tree carries the release's number
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          got="$(sed -n 's/^bombvaultVersion=//p' android/gradle.properties)"
          if [ "$got" != "${TAG#v}" ]; then
            echo "::error::android/gradle.properties says $got, the release is ${TAG#v}"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the launcher
        working-directory: web
        run: |
          npm ci
          npm run build:launcher

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Assemble
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          # A test build counts up with the run, so it installs over the last
          # one and below the first release.
          version="0.0.$GITHUB_RUN_NUMBER"
          if [ "$RELEASE" = true ]; then
            version="${TAG#v}"
          fi
          # Every build of this repository carries the release key, so a test
          # build installs over the app a phone already has. A fork's pull
          # request gets no secrets and builds with the debug key.
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
            echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          fi
          # Google Play takes a bundle, signed with the same key.
          ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease -PbombvaultVersion="$version"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/bombvault-android.apk
          cp app/build/outputs/bundle/release/app-release.aab out/bombvault-android.aab

      # The environment saying which key to use is no proof of the key used.
      - name: The APK carries the release key
        if: env.RELEASE == 'true'
        run: |
          set -eu
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs android/out/bombvault-android.apk)"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::the release APK is signed with the debug key"
            exit 1
          fi

      - name: Attach to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" android/out/bombvault-android.apk android/out/bombvault-android.aab --clobber

      # The first listing was made by hand; from then on each release goes to
      # the track PLAY_TRACK names, with the changelog fastlane holds for its
      # versionCode.
      - name: Release notes for Google Play
        if: env.RELEASE == 'true' && vars.PLAY_TRACK != ''
        run: |
          set -eu
          code="$(sed -n 's/^bombvaultVersionCode=//p' android/gradle.properties)"
          mkdir -p android/out/whatsnew
          for lang in en-US de-DE; do
            cp "fastlane/metadata/android/$lang/changelogs/$code.txt" "android/out/whatsnew/whatsnew-$lang"
          done

      - name: Send to Google Play
        if: env.RELEASE == 'true' && vars.PLAY_TRACK != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: bombvault.halleluja.design
          releaseFiles: android/out/bombvault-android.aab
          track: ${{ vars.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: android/out/whatsnew

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bombvault-android
          path: |
            android/out/bombvault-android.apk
            android/out/bombvault-android.aab
          if-no-files-found: error
          retention-days: 14
