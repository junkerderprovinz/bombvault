name: Docker Hub description

# Sync the README as the Docker Hub page description + a keyword-rich short
# description (helps Docker Hub search / SEO). Runs only when the Docker Hub
# mirror is configured (DOCKERHUB_USERNAME variable) and a DOCKERHUB_PASSWORD
# secret is set (peter-evans needs the account password or a repo-scoped PAT,
# which the push token DOCKERHUB_TOKEN does not cover). Skips cleanly otherwise,
# so a missing credential never fails.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Docker Hub description sync ready?
        id: ready
        env:
          PW: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "DOCKERHUB_PASSWORD not set — skipping Docker Hub description sync"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync README to Docker Hub
        if: ${{ steps.ready.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/bombvault
          short-description: "Unraid backup & full disaster recovery: Docker containers, KVM VMs, flash config, restic-powered. Drop a backup, detonate a restore."
          enable-url-completion: true
