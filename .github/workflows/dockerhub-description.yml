# Push the README to the Docker Hub repo's Overview, on demand and nothing else.
#
# build.yml already does this after every image push, but only after a full
# multi-arch build. That makes it useless for answering the one question worth
# answering when the sync starts failing: is the credential broken, or is this
# repo's secret wrong? A run that builds nothing isolates the credential.
#
# Manual only. It never builds, never pushes an image, and touches nothing but
# the description text on Docker Hub.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v5

      # No gate and no continue-on-error here, unlike build.yml: this workflow
      # exists to make a failure visible, so a missing secret or a refused
      # login must turn the run red instead of passing quietly.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/bombvault
          short-description: "Backup and full disaster recovery for Unraid: Docker containers, KVM VMs and the USB flash."
          enable-url-completion: true
