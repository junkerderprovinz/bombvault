# Pushes the README to the Docker Hub overview without building anything, so a
# failing sync in build.yml can be traced to the credential alone.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Unlike build.yml there is no check for the secret: a missing token or a
      # refused login should fail this run.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/bombvault
          short-description: "Backup and full disaster recovery for Unraid: Docker containers, KVM VMs and the USB flash."
          enable-url-completion: true
