name: OS updates

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: read
      packages: write
    uses: junkerderprovinz/junkerderprovinz/.github/workflows/os-updates.yml@7859a8c4da40e645b49c2bf7a7bef78edef44228 # main
    with:
      dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
