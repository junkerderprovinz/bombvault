name: OS updates

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: read
      packages: write
    uses: junkerderprovinz/junkerderprovinz/.github/workflows/os-updates.yml@f5937a675c3b6a983563f2c59ae05493a2efb8d5 # main
    with:
      dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
