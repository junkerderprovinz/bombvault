name: OS updates

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: read
      packages: write
    uses: junkerderprovinz/junkerderprovinz/.github/workflows/os-updates.yml@827ea277c997dd85269a7b902037b04b6e928ec5 # main
    with:
      dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
