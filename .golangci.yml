version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
  exclusions:
    rules:
      - path: internal/(template|paths)/
        linters: [gosec]
        text: "G304|G306"
      - path: node_modules/
        linters: [govet]
      # staticcheck does not treat t.Fatal as terminating, so the usual
      # "if x == nil { t.Fatal(...) }; x.field" test pattern trips SA5011.
      - path: '_test\.go'
        linters: [staticcheck]
        text: "SA5011"
