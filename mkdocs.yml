site_name: BombVault
site_description: Backup and full disaster recovery for Unraid (Docker containers, KVM VMs, USB flash, appdata/config).
site_url: https://junkerderprovinz.github.io/bombvault/
site_author: Junker der Provinz

repo_url: https://github.com/junkerderprovinz/bombvault
repo_name: junkerderprovinz/bombvault
edit_uri: edit/main/docs/

copyright: Copyright (C) 2026 Junker der Provinz. Licensed AGPL-3.0.

theme:
  name: material
  language: en
  custom_dir: docs-theme/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Noto Sans
    code: Noto Sans Mono
  palette:
    # Without media queries Material opens with the first palette, so the docs
    # start dark for everyone. The app itself follows the system theme.
    - scheme: slate
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # No tabs: the sidebar shows the whole tree, and toc.integrate folds the
    # current page's sections into it.
    - navigation.sections
    - navigation.top
    - navigation.footer
    # No navigation.instant: mkdocs-static-i18n does not support it, and the
    # warning fails the strict build.
    - content.code.copy
    - search.suggest
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

extra_css:
  # Flag images for the language picker, since Windows shows flag emoji as
  # letter pairs.
  - stylesheets/flag-icons.min.css

extra:
  docs_theme:
    accent: "#FCC419"
    flags: true
    hero:
      claim: Drop a backup.
      accent: Detonate a restore.
      text: Backup and full disaster recovery for Unraid and other Docker hosts. Containers, VMs, folders, ZFS datasets and the flash drive, restored the way they were.
      buttons:
        - { text: Get started, link: getting-started/, primary: true }
        - { text: Worked examples, link: guides/ }
        - { text: Source code, link: "https://github.com/junkerderprovinz/bombvault" }

# Every locale is built. A page without a translation (index.de.md next to
# index.md) falls back to English.
plugins:
  # Adding a plugins block disables the implicit search plugin, so re-add it.
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - { locale: en, name: English,       default: true }
        - { locale: de, name: Deutsch, nav_translations: { "Using BombVault": "BombVault nutzen", "Reference": "Referenz" } }
        - { locale: ar, name: العربية, nav_translations: { "Using BombVault": "استخدام BombVault", "Reference": "المرجع" } }
        - { locale: cs, name: Čeština, nav_translations: { "Using BombVault": "Používání BombVaultu", "Reference": "Reference" } }
        - { locale: da, name: Dansk, nav_translations: { "Using BombVault": "Brug af BombVault", "Reference": "Reference" } }
        - { locale: el, name: Ελληνικά, nav_translations: { "Using BombVault": "Χρήση του BombVault", "Reference": "Αναφορά" } }
        - { locale: es, name: Español, nav_translations: { "Using BombVault": "Usar BombVault", "Reference": "Referencia" } }
        - { locale: fi, name: Suomi, nav_translations: { "Using BombVault": "Käyttö", "Reference": "Viitetiedot" } }
        - { locale: fr, name: Français, nav_translations: { "Using BombVault": "Utiliser BombVault", "Reference": "Référence" } }
        - { locale: he, name: עברית, nav_translations: { "Using BombVault": "שימוש ב-BombVault", "Reference": "עיון" } }
        - { locale: hu, name: Magyar, nav_translations: { "Using BombVault": "A BombVault használata", "Reference": "Referencia" } }
        - { locale: it, name: Italiano, nav_translations: { "Using BombVault": "Usare BombVault", "Reference": "Riferimento" } }
        - { locale: ja, name: 日本語, nav_translations: { "Using BombVault": "BombVault の使い方", "Reference": "リファレンス" } }
        - { locale: ko, name: 한국어, nav_translations: { "Using BombVault": "사용하기", "Reference": "참조" } }
        - { locale: nl, name: Nederlands, nav_translations: { "Using BombVault": "BombVault gebruiken", "Reference": "Naslag" } }
        # "no" is quoted: YAML parses the bare word no as the boolean false.
        - { locale: "no", name: Norsk, nav_translations: { "Using BombVault": "Bruk av BombVault", "Reference": "Referanse" } }
        - { locale: pl, name: Polski, nav_translations: { "Using BombVault": "Korzystanie z BombVault", "Reference": "Dokumentacja referencyjna" } }
        - { locale: pt, name: Português, nav_translations: { "Using BombVault": "Utilizar o BombVault", "Reference": "Referência" } }
        - { locale: ro, name: Română, nav_translations: { "Using BombVault": "Utilizare BombVault", "Reference": "Referință" } }
        - { locale: ru, name: Русский, nav_translations: { "Using BombVault": "Использование BombVault", "Reference": "Справочник" } }
        - { locale: sv, name: Svenska, nav_translations: { "Using BombVault": "Använda BombVault", "Reference": "Referens" } }
        - { locale: th, name: ไทย, nav_translations: { "Using BombVault": "การใช้งาน BombVault", "Reference": "เอกสารอ้างอิง" } }
        - { locale: tr, name: Türkçe, nav_translations: { "Using BombVault": "BombVault'u kullanma", "Reference": "Başvuru" } }
        - { locale: uk, name: Українська, nav_translations: { "Using BombVault": "Використання BombVault", "Reference": "Довідник" } }
        - { locale: vi, name: Tiếng Việt, nav_translations: { "Using BombVault": "Sử dụng BombVault", "Reference": "Tham khảo" } }
        - { locale: zh, name: 中文, nav_translations: { "Using BombVault": "使用 BombVault", "Reference": "参考" } }

markdown_extensions:
  - admonition
  - tables
  # attr_list gives headings a fixed {#id}, so anchors survive translation.
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# No page titles: each page's translated H1 becomes its nav label. A section
# title has no H1 to take its text from, so it needs nav_translations per locale.
nav:
  - index.md
  - getting-started.md
  - guides.md
  - Using BombVault:
      - overview.md
      - backups.md
      - restore.md
      - offsite-recovery.md
      - schedules.md
      - notifications.md
      - anomalies.md
  - Reference:
      - settings.md
      - configuration.md
      - zfs-datasets.md
      - vm-backup-ssh-setup.md
      - mcp.md
      - api.md
  - android.md
  - troubleshooting.md
  - features.md
