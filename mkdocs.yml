site_name: BombVault
site_description: Backup and full disaster recovery for Unraid (Docker containers, KVM VMs, USB flash, appdata/config).
site_url: https://junkerderprovinz.github.io/bombvault/
site_author: Junker der Provinz

repo_url: https://github.com/junkerderprovinz/bombvault
repo_name: junkerderprovinz/bombvault
edit_uri: edit/main/docs/

copyright: Copyright (C) 2026 Junker der Provinz. Licensed AGPL-3.0.

theme:
  name: material
  language: en
  # App-style sidebar-footer controls (language picker + dark/light toggle) are
  # injected by a partial override; see overrides/main.html.
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    # Dark scheme listed FIRST, with no media query, so it is the unconditional
    # default: with plain (media-less) palettes Material uses the first as the
    # default and does not follow the OS preference. BombVault is dark-first (Carbon
    # #161616, sunflower-yellow accent), so the site opens dark for every visitor.
    - scheme: slate
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light scheme (IBM Carbon light: black chrome, dark-gold links for contrast).
    # Reachable via the toggle and remembered per browser afterwards.
    - scheme: default
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # No top tabs: the left rail always shows the whole page tree, and
    # toc.integrate expands only the active page's sections underneath it.
    - navigation.top
    - navigation.footer
    # navigation.instant is intentionally NOT enabled: mkdocs-static-i18n warns
    # (build --strict fails) that its language handling is incompatible with
    # instant navigation, and our own sidebar language switcher navigates with a
    # full load anyway, so instant nav buys nothing here.
    - content.code.copy
    - search.suggest
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

extra_css:
  # Real flag images for the language picker (same library the app uses), so the
  # flags render everywhere instead of degrading to letter pairs on Windows.
  - stylesheets/flag-icons.min.css
  - stylesheets/extra.css

extra_javascript:
  # Wires the sidebar-footer language picker + dark/light toggle injected by
  # overrides/main.html. Uses event delegation + document$, so it survives
  # Material's instant navigation.
  - javascripts/bv-sidebar-controls.js

# =============================================================================
# Multi-language (mkdocs-static-i18n). English is the default and the fallback:
# every locale is built (26 in total, matching the app's language set), and any
# page without a translation falls back to the English content, so no broken or
# empty pages are ever produced. Translations are added later as suffixed files
# (e.g. index.de.md next to index.md); until then every locale serves English.
# =============================================================================
plugins:
  # Adding a plugins block disables the implicit search plugin, so re-add it.
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - { locale: en, name: English,       default: true }
        - { locale: de, name: Deutsch }
        - { locale: ar, name: العربية }
        - { locale: cs, name: Čeština }
        - { locale: da, name: Dansk }
        - { locale: el, name: Ελληνικά }
        - { locale: es, name: Español }
        - { locale: fi, name: Suomi }
        - { locale: fr, name: Français }
        - { locale: he, name: עברית }
        - { locale: hu, name: Magyar }
        - { locale: it, name: Italiano }
        - { locale: ja, name: 日本語 }
        - { locale: ko, name: 한국어 }
        - { locale: nl, name: Nederlands }
        # "no" is quoted: YAML parses the bare word no as the boolean false.
        - { locale: "no", name: Norsk }
        - { locale: pl, name: Polski }
        - { locale: pt, name: Português }
        - { locale: ro, name: Română }
        - { locale: ru, name: Русский }
        - { locale: sv, name: Svenska }
        - { locale: th, name: ไทย }
        - { locale: tr, name: Türkçe }
        - { locale: uk, name: Українська }
        - { locale: vi, name: Tiếng Việt }
        - { locale: zh, name: 中文 }

markdown_extensions:
  - admonition
  - tables
  # attr_list lets a heading carry an explicit, language-stable id ({#slug}) so
  # cross-page anchor links keep working after the heading text is translated.
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Internal planning docs and the GitHub-only VM guide ship in docs/ but are not
# part of the published site, so they are excluded from the build (keeps
# mkdocs build --strict clean instead of warning on pages missing from nav).
exclude_docs: |
  superpowers/
  vm-backup-ssh-setup.md

# No explicit titles: each page's (translated) H1 becomes its nav label, so the
# sidebar navigation is localized per language along with the page content.
nav:
  - index.md
  - getting-started.md
  - features.md
  - configuration.md
  - offsite-recovery.md
  - troubleshooting.md
