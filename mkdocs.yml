site_name: BombVault
site_description: Backup and full disaster recovery for Unraid (Docker containers, KVM VMs, USB flash, appdata/config).
site_url: https://junkerderprovinz.github.io/bombvault/
site_author: Junker der Provinz

repo_url: https://github.com/junkerderprovinz/bombvault
repo_name: junkerderprovinz/bombvault
edit_uri: edit/main/docs/

copyright: Copyright (C) 2026 Junker der Provinz. Licensed AGPL-3.0.

theme:
  name: material
  language: en
  # overrides/main.html adds the language picker and theme toggle to the sidebar.
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    # Without media queries Material opens with the first palette, so the docs
    # start dark for everyone. The app itself follows the system theme.
    - scheme: slate
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # No tabs: the sidebar shows the whole tree, and toc.integrate folds the
    # current page's sections into it.
    - navigation.top
    - navigation.footer
    # No navigation.instant: mkdocs-static-i18n does not support it, and the
    # warning fails the strict build.
    - content.code.copy
    - search.suggest
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

extra_css:
  # Flag images for the language picker, since Windows shows flag emoji as
  # letter pairs.
  - stylesheets/flag-icons.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/bv-sidebar-controls.js

# Every locale is built. A page without a translation (index.de.md next to
# index.md) falls back to English.
plugins:
  # Adding a plugins block disables the implicit search plugin, so re-add it.
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - { locale: en, name: English,       default: true }
        - { locale: de, name: Deutsch }
        - { locale: ar, name: العربية }
        - { locale: cs, name: Čeština }
        - { locale: da, name: Dansk }
        - { locale: el, name: Ελληνικά }
        - { locale: es, name: Español }
        - { locale: fi, name: Suomi }
        - { locale: fr, name: Français }
        - { locale: he, name: עברית }
        - { locale: hu, name: Magyar }
        - { locale: it, name: Italiano }
        - { locale: ja, name: 日本語 }
        - { locale: ko, name: 한국어 }
        - { locale: nl, name: Nederlands }
        # "no" is quoted: YAML parses the bare word no as the boolean false.
        - { locale: "no", name: Norsk }
        - { locale: pl, name: Polski }
        - { locale: pt, name: Português }
        - { locale: ro, name: Română }
        - { locale: ru, name: Русский }
        - { locale: sv, name: Svenska }
        - { locale: th, name: ไทย }
        - { locale: tr, name: Türkçe }
        - { locale: uk, name: Українська }
        - { locale: vi, name: Tiếng Việt }
        - { locale: zh, name: 中文 }

markdown_extensions:
  - admonition
  - tables
  # attr_list gives headings a fixed {#id}, so anchors survive translation.
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# The VM guide is read on GitHub. Leaving it out of the site keeps --strict from
# failing on a page that is not in nav.
exclude_docs: |
  vm-backup-ssh-setup.md

# No titles: each page's translated H1 becomes its nav label.
nav:
  - index.md
  - getting-started.md
  - features.md
  - configuration.md
  - offsite-recovery.md
  - mcp.md
  - troubleshooting.md
